name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; si llega un push nuevo, se cancela el anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # IDs públicos de HubSpot: Settings > Secrets and variables > Actions > Variables.
      # Si no están definidos, la web funciona con WhatsApp como respaldo.
      - run: npm run build
        env:
          VITE_HUBSPOT_PORTAL_ID: ${{ vars.VITE_HUBSPOT_PORTAL_ID }}
          VITE_HUBSPOT_REGION: ${{ vars.VITE_HUBSPOT_REGION }}
          VITE_HUBSPOT_APPOINTMENT_FORM_ID: ${{ vars.VITE_HUBSPOT_APPOINTMENT_FORM_ID }}
          VITE_HUBSPOT_ORDER_FORM_ID: ${{ vars.VITE_HUBSPOT_ORDER_FORM_ID }}
          VITE_HUBSPOT_MEETINGS_URL: ${{ vars.VITE_HUBSPOT_MEETINGS_URL }}
          VITE_HUBSPOT_MARKETING_SUBSCRIPTION_ID: ${{ vars.VITE_HUBSPOT_MARKETING_SUBSCRIPTION_ID }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
